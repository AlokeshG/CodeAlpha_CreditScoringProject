<!DOCTYPE html>
<html>
<head>
    <title>Credit Scoring Model</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<p class="footer">Machine Learning Credit Scoring System</p>
<div class="container">

    <h1>Credit Scoring Prediction</h1>

    <form action="/predict" method="POST">

        <input type="number" name="income" placeholder="Income" required>

        <input type="number" name="debt" placeholder="Debt" required>

        <input type="number" name="payment_history" placeholder="Payment History (1 or 0)" required>

        <input type="number" name="loan_amount" placeholder="Loan Amount" required>

        <button type="submit">Predict</button>

    </form>

    <h2 class="result">{{ prediction_text }}</h2>

</div>

</body>
</html>
